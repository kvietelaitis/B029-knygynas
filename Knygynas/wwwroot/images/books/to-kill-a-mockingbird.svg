<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title>To Kill a Mockingbird cover</title>
  <desc>Stylized book cover for To Kill a Mockingbird</desc>
  <defs>
	<linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
	  <stop offset="0%" stop-color="#5c3a2e"/>
	  <stop offset="55%" stop-color="#9a6b4f"/>
	  <stop offset="100%" stop-color="#f0d2a7"/>
	</linearGradient>
  </defs>
  <rect width="600" height="800" rx="36" fill="url(#g)"/>
  <rect x="62" y="62" width="476" height="676" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.24)"/>
  <text x="92" y="150" fill="#fdf7f0" font-family="Arial, sans-serif" font-size="26" letter-spacing="5">HARPER LEE</text>
  <text x="92" y="260" fill="#ffffff" font-family="Georgia, serif" font-size="65" font-weight="800">To Kill a</text>
  <text x="92" y="334" fill="#ffffff" font-family="Georgia, serif" font-size="65" font-weight="800">Mockingbird</text>
  <circle cx="442" cy="250" r="52" fill="none" stroke="#fff6" stroke-width="8"/>
  <circle cx="442" cy="250" r="20" fill="#fff" opacity="0.3"/>
  <text x="92" y="470" fill="#fff7f0" font-family="Arial, sans-serif" font-size="26" letter-spacing="3">A STORY OF COMPASSION</text>
  <rect x="92" y="500" width="320" height="8" rx="4" fill="#fff7f0" opacity="0.8"/>
  <text x="92" y="560" fill="#fff" font-family="Arial, sans-serif" font-size="22" opacity="0.9">A classic novel about empathy,</text>
  <text x="92" y="592" fill="#fff" font-family="Arial, sans-serif" font-size="22" opacity="0.9">justice, and childhood.</text>
